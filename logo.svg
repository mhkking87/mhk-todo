<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#6ee7b7"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bg)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Clipboard -->
  <rect x="35" y="28" width="50" height="64" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- Clip -->
  <rect x="48" y="22" width="24" height="14" rx="5" fill="url(#bg)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <circle cx="60" cy="29" r="3" fill="rgba(255,255,255,0.6)"/>
  <!-- Lines -->
  <rect x="44" y="44" width="32" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="44" y="54" width="26" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="44" y="64" width="28" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <!-- Checkmark -->
  <circle cx="52" cy="80" r="8" fill="url(#check)"/>
  <polyline points="48,80 51,83 57,77" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
