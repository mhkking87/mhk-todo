<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Vazirmatn',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0a0a1a,#1a1040,#0d1f3c);display:flex;justify-content:center;padding:30px 16px;overflow-x:hidden}
        .container{width:100%;max-width:680px}

        /* ===== WELCOME SCREEN ===== */
        .welcome-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:85vh;animation:fadeIn .8s ease}
        .welcome-logo{font-size:5rem;margin-bottom:20px;animation:bounce 2s ease infinite}
        .welcome-title{color:#fff;font-size:2rem;font-weight:900;text-align:center;margin-bottom:8px}
        .welcome-title span{background:linear-gradient(135deg,#a78bfa,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .welcome-sub{color:rgba(255,255,255,.4);font-size:.95rem;margin-bottom:40px;text-align:center}
        .welcome-form{width:100%;max-width:400px}
        .welcome-input{width:100%;padding:18px 22px;border:none;border-radius:16px;background:rgba(255,255,255,.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);color:#fff;font-family:'Vazirmatn',sans-serif;font-size:1.1rem;outline:none;text-align:center;transition:all .3s ease;margin-bottom:16px}
        .welcome-input::placeholder{color:rgba(255,255,255,.25)}
        .welcome-input:focus{border-color:rgba(167,139,250,.5);box-shadow:0 0 40px rgba(108,92,231,.15)}
        .welcome-btn{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#6c5ce7,#a78bfa);color:#fff;font-family:'Vazirmatn',sans-serif;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .3s ease}
        .welcome-btn:hover{transform:translateY(-3px);box-shadow:0 10px 40px rgba(108,92,231,.4)}
        .welcome-btn:active{transform:translateY(0)}
        .welcome-hint{color:rgba(255,255,255,.2);font-size:.75rem;margin-top:20px}
        .hidden{display:none!important}

        /* ===== MAIN APP ===== */
        .header{text-align:center;margin-bottom:30px;animation:fadeInDown .8s ease}
        .header h1{color:#fff;font-size:2rem;font-weight:900;margin-bottom:6px}
        .header h1 span{background:linear-gradient(135deg,#a78bfa,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .greeting{color:rgba(255,255,255,.45);font-size:.9rem;font-weight:300;min-height:24px;transition:all .5s ease}

        /* Stats */
        .stats{display:flex;gap:10px;margin-bottom:22px;animation:fadeInUp .8s ease .2s both}
        .stat-card{flex:1;background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:16px 12px;text-align:center;transition:all .3s ease}
        .stat-card:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
        .stat-number{font-size:1.7rem;font-weight:800;line-height:1;margin-bottom:4px}
        .stat-card:nth-child(1) .stat-number{color:#60a5fa}
        .stat-card:nth-child(2) .stat-number{color:#34d399}
        .stat-card:nth-child(3) .stat-number{color:#f472b6}
        .stat-card:nth-child(4) .stat-number{color:#fbbf24}
        .stat-label{color:rgba(255,255,255,.35);font-size:.72rem}

        /* Progress */
        .progress-wrapper{margin-bottom:22px;animation:fadeInUp .8s ease .3s both}
        .progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .progress-text{color:rgba(255,255,255,.5);font-size:.82rem}
        .progress-percent{color:#a78bfa;font-weight:700;font-size:.88rem}
        .progress-bar{width:100%;height:7px;background:rgba(255,255,255,.07);border-radius:10px;overflow:hidden}
        .progress-fill{height:100%;background:linear-gradient(90deg,#6c5ce7,#a78bfa,#60a5fa);border-radius:10px;transition:width .6s cubic-bezier(.22,1,.36,1);width:0%}

        /* Input */
        .input-area{display:flex;gap:10px;margin-bottom:22px;animation:fadeInUp .8s ease .4s both}
        .input-area input{flex:1;padding:15px 18px;border:none;border-radius:13px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);color:#fff;font-family:'Vazirmatn',sans-serif;font-size:.95rem;outline:none;transition:all .3s ease}
        .input-area input::placeholder{color:rgba(255,255,255,.25)}
        .input-area input:focus{border-color:rgba(167,139,250,.4);background:rgba(255,255,255,.08);box-shadow:0 0 30px rgba(108,92,231,.1)}
        .add-btn{padding:15px 22px;border:none;border-radius:13px;background:linear-gradient(135deg,#6c5ce7,#a78bfa);color:#fff;font-family:'Vazirmatn',sans-serif;font-size:1.3rem;font-weight:700;cursor:pointer;transition:all .3s ease;min-width:54px;display:flex;align-items:center;justify-content:center}
        .add-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(108,92,231,.35)}
        .add-btn:active{transform:translateY(0)}

        /* Speech Bubble */
        .speech-bubble{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(108,92,231,.9);backdrop-filter:blur(20px);color:#fff;padding:14px 24px;border-radius:20px;font-size:.9rem;font-weight:500;box-shadow:0 10px 40px rgba(0,0,0,.3);z-index:1000;opacity:0;transition:all .5s cubic-bezier(.22,1,.36,1);pointer-events:none;max-width:90%;text-align:center}
        .speech-bubble.show{opacity:1;transform:translateX(-50%) translateY(-10px)}

        /* Filters */
        .filters{display:flex;gap:7px;margin-bottom:18px;animation:fadeInUp .8s ease .5s both;flex-wrap:wrap}
        .filter-btn{padding:7px 16px;border:none;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.4);font-family:'Vazirmatn',sans-serif;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .3s ease}
        .filter-btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)}
        .filter-btn.active{background:rgba(108,92,231,.25);border-color:rgba(167,139,250,.35);color:#a78bfa}

        /* Task List */
        .task-list{animation:fadeInUp .8s ease .6s both}
        .task-item{display:flex;align-items:center;gap:12px;padding:14px 18px;margin-bottom:8px;background:rgba(255,255,255,.04);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.05);border-radius:13px;transition:all .4s cubic-bezier(.22,1,.36,1);animation:taskSlideIn .4s ease;position:relative;overflow:hidden}
        .task-item::before{content:'';position:absolute;top:0;right:0;width:3px;height:100%;background:linear-gradient(180deg,#6c5ce7,#a78bfa);border-radius:0 13px 13px 0;transition:all .3s ease}
        .task-item:hover{background:rgba(255,255,255,.07);transform:translateX(-3px);border-color:rgba(255,255,255,.08)}
        .task-item.completed::before{background:linear-gradient(180deg,#34d399,#6ee7b7)}
        .task-item.completed{background:rgba(52,211,153,.04)}
        .task-item.removing{animation:taskSlideOut .4s ease forwards}

        .checkbox{position:relative;width:24px;height:24px;cursor:pointer;flex-shrink:0}
        .checkbox input{display:none}
        .checkmark{position:absolute;top:0;right:0;width:24px;height:24px;border-radius:7px;border:2px solid rgba(255,255,255,.18);transition:all .3s ease;display:flex;align-items:center;justify-content:center}
        .checkmark::after{content:'✓';color:#fff;font-size:13px;font-weight:700;opacity:0;transform:scale(0);transition:all .3s cubic-bezier(.22,1,.36,1)}
        .checkbox input:checked+.checkmark{background:linear-gradient(135deg,#34d399,#6ee7b7);border-color:transparent;box-shadow:0 4px 12px rgba(52,211,153,.3)}
        .checkbox input:checked+.checkmark::after{opacity:1;transform:scale(1)}

        .task-text{flex:1;color:rgba(255,255,255,.8);font-size:.92rem;font-weight:400;line-height:1.6;word-break:break-word}
        .task-item.completed .task-text{text-decoration:line-through;color:rgba(255,255,255,.25)}
        .task-date{color:rgba(255,255,255,.2);font-size:.68rem;margin-top:3px}

        .delete-btn{width:30px;height:30px;border:none;border-radius:7px;background:rgba(239,68,68,.08);color:rgba(239,68,68,.5);font-size:1rem;cursor:pointer;transition:all .3s ease;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0}
        .task-item:hover .delete-btn{opacity:1}
        .delete-btn:hover{background:rgba(239,68,68,.18);color:#ef4444;transform:scale(1.1)}

        /* Empty */
        .empty-state{text-align:center;padding:50px 20px;animation:fadeIn .8s ease}
        .empty-state .emoji{font-size:3.5rem;margin-bottom:12px}
        .empty-state h3{color:rgba(255,255,255,.5);font-weight:500;font-size:1.05rem;margin-bottom:6px}
        .empty-state p{color:rgba(255,255,255,.25);font-size:.82rem}

        /* Clear */
        .clear-area{text-align:center;margin-top:22px;animation:fadeInUp .8s ease .7s both}
        .clear-btn{padding:9px 22px;border:none;border-radius:9px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.12);color:rgba(239,68,68,.5);font-family:'Vazirmatn',sans-serif;font-size:.82rem;cursor:pointer;transition:all .3s ease}
        .clear-btn:hover{background:rgba(239,68,68,.18);color:#ef4444}

        /* ===== HISTORY ===== */
        .history-section{margin-top:35px;animation:fadeInUp .8s ease .8s both}
        .history-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;cursor:pointer;user-select:none}
        .history-header h2{color:rgba(255,255,255,.6);font-size:1.05rem;font-weight:600}
        .history-toggle{color:rgba(255,255,255,.25);font-size:.8rem;transition:transform .3s ease}
        .history-toggle.open{transform:rotate(180deg)}
        .history-badge{background:rgba(52,211,153,.12);color:#34d399;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px;margin-right:auto}
        .history-content{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.22,1,.36,1)}
        .history-content.open{max-height:3000px}

        .history-day{margin-bottom:18px}
        .history-day-label{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 5px}
        .day-name{color:rgba(255,255,255,.45);font-size:.82rem;font-weight:500}
        .day-date{color:rgba(255,255,255,.2);font-size:.72rem}
        .day-count{margin-right:auto;background:rgba(255,255,255,.05);color:rgba(255,255,255,.3);font-size:.68rem;padding:2px 8px;border-radius:10px}
        .history-item{display:flex;align-items:center;gap:10px;padding:9px 14px;margin-bottom:5px;background:rgba(52,211,153,.03);border-radius:10px;border-right:2px solid rgba(52,211,153,.15);transition:all .3s ease}
        .history-item:hover{background:rgba(52,211,153,.07)}
        .h-check{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(110,231,183,.18));display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
        .h-text{flex:1;color:rgba(255,255,255,.45);font-size:.85rem;line-height:1.5}
        .h-time{color:rgba(255,255,255,.18);font-size:.68rem;flex-shrink:0}
        .history-empty{text-align:center;padding:30px;color:rgba(255,255,255,.18);font-size:.82rem}
        .history-empty .he{font-size:2.2rem;margin-bottom:8px}

        /* Footer */
        .footer{text-align:center;margin-top:35px;padding-bottom:20px;color:rgba(255,255,255,.12);font-size:.7rem}

        /* Animations */
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes taskSlideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
        @keyframes taskSlideOut{from{opacity:1;transform:translateX(0);height:auto;margin-bottom:8px;padding:14px 18px}to{opacity:0;transform:translateX(-30px);height:0;margin-bottom:0;padding:0 18px}}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        @keyframes popIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

        @media(max-width:500px){body{padding:16px 10px}.header h1{font-size:1.5rem}.input-area{flex-direction:column}.add-btn{width:100%;padding:14px}.stat-number{font-size:1.3rem}}
    </style>
</head>
<body>

<!-- ===== WELCOME SCREEN ===== -->
<div class="welcome-screen" id="welcome-screen">
    <div class="welcome-logo">📋</div>
    <div class="welcome-title">به <span>To Do List</span> خوش اومدی!</div>
    <div class="welcome-sub">اسمت رو بنویس تا شخصی‌سازی شه</div>
    <div class="welcome-form">
        <input type="text" class="welcome-input" id="name-input" placeholder="اسمت چیه؟" autofocus>
        <button class="welcome-btn" id="start-btn">🚀 شروع کن!</button>
    </div>
    <div class="welcome-hint">توسعه دهنده: محمدحسین (mohak) ❤️</div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="container hidden" id="main-app">
    <div class="header">
        <h1>📋 To Do List — <span id="user-name-display"></span></h1>
        <div class="greeting" id="greeting"></div>
    </div>

    <div class="stats">
        <div class="stat-card"><div class="stat-number" id="total-count">0</div><div class="stat-label">کل کارها</div></div>
        <div class="stat-card"><div class="stat-number" id="done-count">0</div><div class="stat-label">انجام شده</div></div>
        <div class="stat-card"><div class="stat-number" id="pending-count">0</div><div class="stat-label">باقی‌مانده</div></div>
        <div class="stat-card"><div class="stat-number" id="streak-count">0</div><div class="stat-label">🔥 روز متوالی</div></div>
    </div>

    <div class="progress-wrapper">
        <div class="progress-info">
            <span class="progress-text">پیشرفت امروز</span>
            <span class="progress-percent" id="progress-percent">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="input-area">
        <input type="text" id="task-input" placeholder="کار جدید رو اینجا بنویس...">
        <button class="add-btn" id="add-btn" title="افزودن">+</button>
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">همه</button>
        <button class="filter-btn" data-filter="pending">انجام نشده</button>
        <button class="filter-btn" data-filter="done">انجام شده</button>
    </div>

    <div class="task-list" id="task-list"></div>

    <div class="clear-area" id="clear-area" style="display:none">
        <button class="clear-btn" id="clear-done-btn">🗑️ پاک کردن کارهای انجام شده</button>
    </div>

    <!-- History -->
    <div class="history-section">
        <div class="history-header" id="history-header">
            <h2>📜 تاریخچه ۱۰ روز اخیر</h2>
            <span class="history-badge" id="history-badge">0 کار</span>
            <span class="history-toggle" id="history-toggle">▼</span>
        </div>
        <div class="history-content" id="history-content"></div>
    </div>

    <div class="footer">ساخته شده با ❤️ | توسعه دهنده: <span id="footer-name"></span></div>
</div>

<!-- Speech Bubble -->
<div class="speech-bubble" id="speech-bubble"></div>

<script>
// ===== CONFIG =====
const TASKS_KEY = 'mhk-tasks';
const USER_KEY = 'mhk-user';
const HISTORY_KEY = 'mhk-history';
const STREAK_KEY = 'mhk-streak';

let userName = localStorage.getItem(USER_KEY) || '';
let tasks = JSON.parse(localStorage.getItem(TASKS_KEY) || '[]');
let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
let currentFilter = 'all';

// ===== ELEMENTS =====
const welcomeScreen = document.getElementById('welcome-screen');
const mainApp = document.getElementById('main-app');
const nameInput = document.getElementById('name-input');
const startBtn = document.getElementById('start-btn');
const greetingEl = document.getElementById('greeting');
const taskInput = document.getElementById('task-input');
const addBtn = document.getElementById('add-btn');
const taskList = document.getElementById('task-list');
const speechBubble = document.getElementById('speech-bubble');
const historyHeader = document.getElementById('history-header');
const historyContent = document.getElementById('history-content');
const historyBadge = document.getElementById('history-badge');
const historyToggle = document.getElementById('history-toggle');

// ===== WELCOME =====
if (userName) {
    welcomeScreen.classList.add('hidden');
    mainApp.classList.remove('hidden');
    initApp();
} else {
    startBtn.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (!name) { nameInput.style.animation = 'shake .4s ease'; setTimeout(() => nameInput.style.animation = '', 400); return; }
        userName = name;
        localStorage.setItem(USER_KEY, name);
        welcomeScreen.style.opacity = '0';
        welcomeScreen.style.transition = 'opacity .5s ease';
        setTimeout(() => { welcomeScreen.classList.add('hidden'); mainApp.classList.remove('hidden'); initApp(); }, 500);
    });
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') startBtn.click(); });
}

// ===== SPEECH =====
const addTaskPhrases = (n) => [
    `آفرین ${n}! یکی اضافه شد! 💪`,
    `عالیه ${n}! بریم سراغ بعدی! 🚀`,
    `${n} جان، حسابی مشغولی! 🔥`,
    `اوکی ${n}! ثبت شد ✅`,
    `بزن بریم ${n}! 💎`,
    `خوبه ${n}! ادامه بده! ⭐`,
    `ثبت شد ${n}! کار درسته! 🎯`,
];
const completePhrases = (n) => [
    `آفرین ${n}! یکی تموم شد! 🎉`,
    `خوشگل ${n}! ردش کن! ✅`,
    `${n} حرفه‌ای! تمیز تمیز! 💯`,
    `عالیه ${n}! یکی کم شد! 🏆`,
    `${n} بیا جلو! 💥`,
    `تمومش کردی ${n}! دمت گرم! 🤝`,
    `ایول ${n}! رفت تو تاریخچه! 📜`,
    `${n} سنگ تموم گذاشت! 🪨✨`,
    `یه قدم جلوتر ${n}! 🏃‍♂️`,
    `unordered_beautiful ${n}! پیشرفت واقعیه! 📈`,
];
const firstTaskPhrases = (n) => [
    `اولین کارت رو اضافه کردی ${n}! شروع خوبیه! 🌟`,
    `بزن بریم ${n}! اولی ثبت شد! 🎬`,
];
const allDonePhrases = (n) => [
    `همه تموم شد ${n}! آفرین بهت! 🏅`,
    `${n} وایسا ببینم... همه تمیز تمیزه! 💎`,
    `کارهات تموم شد ${n}! حالا استراحت کن! ☕`,
    `${n} قهرمان امروزی! 🦸‍♂️`,
    `تموم شد ${n}! فردا دوباره! 🌅`,
];
const emptyPhrases = (n) => [
    `${n} هنوز کاری نداری! یکی اضافه کن! ✏️`,
    `خالیه ${n}! بزن بریم! 🎯`,
];
const motivationalPhrases = (n) => [
    `${n} داری خوب پیش میری! 💪`,
    `آفرین ${n}! ادامه بده! 🌟`,
    `${n} وایمیستی یا ادامه میدی؟ 🔥`,
];

function say(text) {
    speechBubble.textContent = text;
    speechBubble.classList.add('show');
    clearTimeout(speechBubble._timer);
    speechBubble._timer = setTimeout(() => speechBubble.classList.remove('show'), 3000);
}
function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ===== DATE =====
function dateKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayKey() { return dateKey(Date.now()); }
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return d; }
function formatFaDate(ts) { return new Date(ts).toLocaleDateString('fa-IR', { weekday: 'long', month: 'long', day: 'numeric' }); }
function formatTime(ts) { return new Date(ts).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }); }

// ===== GREETING =====
function setGreeting() {
    const h = new Date().getHours();
    let g = '';
    if (h >= 5 && h < 12) g = '☀️ صبح بخیر';
    else if (h >= 12 && h < 17) g = '🌤️ عصر بخیر';
    else if (h >= 17 && h < 21) g = '🌅 غروب بخیر';
    else g = '🌙 شب بخیر';
    greetingEl.textContent = `${g} ${userName}! امروز چه کارایی داری؟`;
}

// ===== STREAK =====
function calcStreak() {
    const streakData = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"last":"","count":0}');
    const tk = todayKey();
    if (streakData.last === tk) return streakData.count;
    const yesterday = dateKey(Date.now() - 86400000);
    if (streakData.last === yesterday) return streakData.count;
    return 0;
}

function updateStreak() {
    const streakData = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"last":"","count":0}');
    const tk = todayKey();
    const doneToday = tasks.filter(t => t.done && t.completedAt && dateKey(t.completedAt) === tk).length;
    const totalToday = tasks.filter(t => t.createdAt && dateKey(t.createdAt) === tk).length;
    if (doneToday > 0 && doneToday === totalToday && totalToday > 0) {
        if (streakData.last !== tk) {
            const yesterday = dateKey(Date.now() - 86400000);
            streakData.count = streakData.last === yesterday ? streakData.count + 1 : 1;
            streakData.last = tk;
            localStorage.setItem(STREAK_KEY, JSON.stringify(streakData));
        }
    }
}

// ===== HISTORY =====
function saveToHistory(task) {
    history.unshift({
        text: task.text,
        completedAt: task.completedAt || Date.now(),
        createdAt: task.createdAt
    });
    // keep last 200
    if (history.length > 200) history = history.slice(0, 200);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function cleanOldHistory() {
    const cutoff = Date.now() - (10 * 24 * 60 * 60 * 1000);
    history = history.filter(h => h.completedAt > cutoff);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function renderHistory() {
    cleanOldHistory();
    const cutoff = Date.now() - (10 * 24 * 60 * 60 * 1000);
    const recent = history.filter(h => h.completedAt > cutoff);

    historyBadge.textContent = recent.length + ' کار';

    if (recent.length === 0) {
        historyContent.innerHTML = `<div class="history-empty"><div class="he">📭</div>هنوز کار تموم شده‌ای نداری!</div>`;
        return;
    }

    // Group by day
    const grouped = {};
    recent.forEach(h => {
        const dk = dateKey(h.completedAt);
        if (!grouped[dk]) grouped[dk] = [];
        grouped[dk].push(h);
    });

    let html = '';
    const sortedKeys = Object.keys(grouped).sort((a,b) => b.localeCompare(a));

    sortedKeys.forEach(dk => {
        const items = grouped[dk];
        const d = new Date(dk + 'T12:00:00');
        const dayName = d.toLocaleDateString('fa-IR', { weekday: 'long' });
        const dayDate = d.toLocaleDateString('fa-IR', { month: 'short', day: 'numeric' });

        html += `<div class="history-day">
            <div class="history-day-label">
                <span class="day-name">${dayName}</span>
                <span class="day-date">${dayDate}</span>
                <span class="day-count">${items.length} کار</span>
            </div>`;

        items.forEach(h => {
            html += `<div class="history-item">
                <div class="h-check">✓</div>
                <div class="h-text">${h.text}</div>
                <div class="h-time">${formatTime(h.completedAt)}</div>
            </div>`;
        });

        html += '</div>';
    });

    historyContent.innerHTML = html;
}

historyHeader.addEventListener('click', () => {
    historyContent.classList.toggle('open');
    historyToggle.classList.toggle('open');
});

// ===== STATS =====
function updateStats() {
    document.getElementById('total-count').textContent = tasks.length;
    document.getElementById('done-count').textContent = tasks.filter(t => t.done).length;
    document.getElementById('pending-count').textContent = tasks.filter(t => !t.done).length;
    const streak = calcStreak();
    document.getElementById('streak-count').textContent = streak;

    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const percent = total === 0 ? 0 : Math.round((done / total) * 100);
    document.getElementById('progress-percent').textContent = percent + '%';
    document.getElementById('progress-fill').style.width = percent + '%';

    document.getElementById('clear-area').style.display = done > 0 ? 'block' : 'none';
    renderHistory();
}

// ===== TASKS =====
function saveTasks() { localStorage.setItem(TASKS_KEY, JSON.stringify(tasks)); }

function formatTaskDate(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return 'همین الان';
    if (diff < 3600000) return Math.floor(diff/60000) + ' دقیقه پیش';
    if (diff < 86400000) return Math.floor(diff/3600000) + ' ساعت پیش';
    return d.toLocaleDateString('fa-IR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function addTask() {
    const text = taskInput.value.trim();
    if (!text) {
        taskInput.style.animation = 'shake .4s ease';
        setTimeout(() => taskInput.style.animation = '', 400);
        return;
    }
    tasks.unshift({ id: Date.now(), text, done: false, createdAt: Date.now() });
    saveTasks();
    renderTasks();
    taskInput.value = '';
    taskInput.focus();

    if (tasks.length === 1) say(randomFrom(firstTaskPhrases(userName)));
    else say(randomFrom(addTaskPhrases(userName)));
}

function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    if (!task.done) {
        task.done = true;
        task.completedAt = Date.now();
        saveToHistory(task);
        say(randomFrom(completePhrases(userName)));

        // Check if all done
        if (tasks.every(t => t.done)) {
            setTimeout(() => say(randomFrom(allDonePhrases(userName))), 1500);
        }
    } else {
        task.done = false;
        delete task.completedAt;
    }

    saveTasks();
    updateStreak();
    renderTasks();
}

function deleteTask(id) {
    const el = document.querySelector(`[data-id="${id}"]`);
    if (el) {
        el.classList.add('removing');
        setTimeout(() => { tasks = tasks.filter(t => t.id !== id); saveTasks(); renderTasks(); }, 400);
    }
}

function clearDone() {
    const doneEls = document.querySelectorAll('.task-item.completed');
    doneEls.forEach((el, i) => setTimeout(() => el.classList.add('removing'), i * 50));
    setTimeout(() => { tasks = tasks.filter(t => !t.done); saveTasks(); renderTasks(); say('🧹 تمیز شد! حسابی مرتب شدی!'); }, doneEls.length * 50 + 400);
}

function renderTasks() {
    let filtered = tasks;
    if (currentFilter === 'done') filtered = tasks.filter(t => t.done);
    if (currentFilter === 'pending') filtered = tasks.filter(t => !t.done);

    if (filtered.length === 0) {
        const msgs = { all: ['📝', 'هنوز کاری نداری!', 'کارت رو اضافه کن...'], done: ['🎉', 'هنوز هیچ کاری تموم نکردی!', 'بجنب!'], pending: ['✨', 'همه تموم شده!', 'آفرین، استراحت کن!'] };
        const [emoji, title, desc] = msgs[currentFilter];
        taskList.innerHTML = `<div class="empty-state"><div class="emoji">${emoji}</div><h3>${title}</h3><p>${desc}</p></div>`;
    } else {
        taskList.innerHTML = filtered.map(task => `
            <div class="task-item ${task.done ? 'completed' : ''}" data-id="${task.id}">
                <label class="checkbox"><input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${task.id})"><div class="checkmark"></div></label>
                <div style="flex:1"><div class="task-text">${task.text}</div><div class="task-date">${formatTaskDate(task.createdAt)}</div></div>
                <button class="delete-btn" onclick="deleteTask(${task.id})" title="حذف">✕</button>
            </div>`).join('');
    }
    updateStats();
}

// ===== INIT =====
function initApp() {
    document.getElementById('user-name-display').textContent = userName;
    document.getElementById('footer-name').textContent = userName;
    setGreeting();
    renderTasks();
    setTimeout(() => say(`${new Date().getHours() >= 17 ? '🌙 شب' : '☀️ روز'} بخیر ${userName}! چه کارایی داری امروز؟`), 1000);
}

// ===== EVENTS =====
addBtn.addEventListener('click', addTask);
taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentFilter = btn.dataset.filter; renderTasks(); });
});
document.getElementById('clear-done-btn').addEventListener('click', clearDone);
</script>
